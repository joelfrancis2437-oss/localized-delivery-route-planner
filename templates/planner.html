<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Plan Route - Localized Delivery Route Planner
    </title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/svg+xml"
          href="{{ url_for('static', filename='images/favicon.svg') }}">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    {% include "navbar.html" %}


    <div class="container">

        <h1>
            🚚 Plan Your Delivery Route
        </h1>

        <p class="subtitle">
            Enter your pickup location and delivery addresses

        </p>

        <!-- ROUTE FORM -->
        <!-- ========================= -->

        <div class="form-box">


            <!-- PICKUP -->

            <label for="pickup">
                📍 Pickup Location

                type="text"
                id="pickup"
                placeholder="Enter pickup location"
            >

            <label for="address1">
                📦 Delivery Address 1
            </label>

            <input
                type="text"
                id="address1"
                placeholder="Enter delivery address"
            >

            <label for="priority1">
                ⚡ Delivery Priority
            </label>

            <select id="priority1">

                <option value="Normal">
                    Normal
                </option>

                <option value="High">
                    High
                </option>

                <option value="Low">
                    Low
                </option>

            </select>


            <label for="status1">
                📦 Delivery Status
            </label>

            <select id="status1">

                <option value="Pending">
                    Pending
                </option>

                <option value="Out for Delivery">
                    Out for Delivery
                </option>

                <option value="Delivered">
                    Delivered

                <option value="Cancelled">
